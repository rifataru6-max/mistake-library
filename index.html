.meta{line-height:1.3}.meta b{display:block}.meta span{font-size:13px;color:var(--mute)}

.prev{max-width:140px;border-radius:10px}

.act .sv.on{color:var(--pri);background:var(--pri-t)}
.cnt{font-size:13px;color:var(--mute);margin-top:10px}
.cmts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.cm{background:var(--field);border-radius:14px;padding:6px 12px;font-size:15px;line-height:1.5}.cm b{font-size:14px}.cm small{color:var(--mute);margin-left:6px}
.cmf{display:flex;gap:8px}.cmf input{border-radius:999px}
.more,.del{all:unset;cursor:pointer;color:var(--pri);font-size:14px}.del{color:#d33;margin-left:10px}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.stats{display:flex;gap:18px;margin-top:10px}.stats div{text-align:center;line-height:1.3}.stats b{display:block;font-size:20px}.stats span{font-size:13px;color:var(--mute)}
.nt{display:flex;gap:12px;align-items:flex-start}.nt.un{border-left:4px solid var(--pri)}

:root{--g1:#3b4fe0;--g2:#0e8f81}

.logo{gap:10px}.logo svg{width:40px;height:40px;flex:none}

  var PM={"m": ["তখন আমি ভাবতাম, এটা আমার একার সমস্যা নয়, সবাই কমবেশি এভাবেই চলে। তাই নিজের ভুলটাকে ভুল বলেই মানতে চাইনি। কাছের মানুষেরা দু-একবার সাবধান করেছিল, কিন্তু আমি কান দিইনি।", "সবচেয়ে কষ্টের ছিল পরিবারের কাছে মুখ দেখানো। বাবা-মা কিছু বলেননি, কিন্তু তাঁদের চোখের ক্লান্ত দৃষ্টি আমাকে ভেতরে ভেতরে কুরে কুরে খেত।", "রাতে ঘুম আসত না। বারবার মনে হতো, একটু আগে সিদ্ধান্তটা বদলালে সবকিছু অন্যরকম হতে পারত। কিন্তু সময় তো আর পেছনে ফেরানো যায় না।", "বন্ধুদের কাউকে কিছু জানাইনি। ভয় ছিল, ওরা কী ভাববে। চুপচাপ একা সামলাতে গিয়ে সমস্যাটা আরও জটিল হয়ে গেল।", "শুরুর দিকে সবকিছু ঠিকঠাকই লাগছিল। ছোট ছোট সংকেত আমি দেখেও দেখিনি, ভেবেছিলাম নিজে থেকেই সব ঠিক হয়ে যাবে।", "এক সময় আমি নিজেকেই দোষ দিতে শুরু করলাম, কিন্তু দোষ দিয়ে তো কিছু বদলায় না। দরকার ছিল ঠান্ডা মাথায় বসে বোঝা, ঠিক কোথায় ভুল হয়েছে।"], "g": ["শুরুতে কাজটা সহজ ছিল না। কিছুদিন পরপরই মনে হতো, ছেড়ে দিই। বন্ধুরা মজা করে বলত, 'এটা বেশিদিন টিকবে না।'", "আমি নিজেকে একটাই কথা বলতাম, আজকের দিনটা শুধু পার করো। কাল কী হবে তা কালকের কথা। এভাবে একটা একটা করে দিন জমতে লাগল।", "মাঝে মাঝে ভুলও হয়েছে, কোনো কোনো দিন পুরোটাই বাদ গেছে। কিন্তু আমি নিজেকে দোষ না দিয়ে পরের দিন আবার শুরু করেছি।", "পরিবারের লোকজন প্রথমে অবাক হলেও পরে আমাকে উৎসাহ দিতে শুরু করল। তাদের সমর্থন আমার কাছে অনেক বড় শক্তি ছিল।", "আমি একটা ছোট খাতায় প্রতিদিনের অগ্রগতি লিখে রাখতাম। কিছুদিন পর পাতা উল্টে দেখলে নিজেই অবাক হতাম, কতটা পথ এসেছি।", "যখন ক্লান্ত লাগত, তখন আমি মনে করতাম কেন শুরু করেছিলাম। সেই কারণটাই আমাকে আবার উঠে দাঁড়ানোর শক্তি দিত।"]},PA={"m": ["অবশেষে একজন কাছের মানুষের সঙ্গে খোলাখুলি কথা বললাম। অবাক হয়ে দেখলাম, সে আমাকে বিচার করল না, বরং পাশে দাঁড়াল। সেদিন থেকেই ঘুরে দাঁড়ানোর শুরু।", "ধীরে ধীরে আমি ভুলগুলো কাগজে লিখতে শুরু করলাম। কোথায় ভুল করেছি, কেন করেছি, পরেরবার কী করব। এই ছোট অভ্যাসটাই আমাকে অনেকটা সামলে নিতে সাহায্য করেছে।", "ক্ষতিটা পুরোপুরি পূরণ হয়নি, কিন্তু আমি নতুন করে শুরু করেছি। এবার ছোট ছোট ধাপে, তাড়াহুড়ো না করে।", "সময় লেগেছে, কিন্তু এখন আমি আগের চেয়ে অনেক সতর্ক। কোনো সিদ্ধান্ত নেওয়ার আগে নিজেকে কয়েকটা প্রশ্ন করি, আর function updLinks(){var o=shO(),m=shMsg(),u=encodeURIComponent(shUrl()),e=encodeURIComponent(m);
  $("shw").href="https://wa.me/?text="+encodeURIComponent(m+"\n"+shUrl());

  $("she").href="mailto:?subject="+encodeURIComponent(tx(o.t))+"&body="+encodeURIComponent(m+"\n"+shUrl())}
function cp(x){var ok=function(){toast(t("cpd"))},fb=function(){try{var a=document.createElement("textarea");a.value=x;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok()}catch(e){toast(x)}};
  try{navigator.clipboard.writeText(x).then(ok,fb)}catch(e){fb()}}
function closeSh(){$("sheet").classList.remove("show");$("sheet").innerHTML=""}
function openShare(p){shP=p;var o=shO();
  $("sheet").innerHTML='<div class="sh" role="dialog" aria-modal="true"><div class="shh"><h4>'+t("shT")+'</h4><button class="x" data-x="1" aria-label="'+t("cls")+'">✕</button></div><div class="row">'+av(me())+'<b>'+esc(me())+'</b></div><textarea id="scap" placeholder="'+t("shCap")+'" style="margin-top:10px"></textarea><div class="emb"><b>'+esc(tx(o.t))+'</b><div style="color:var(--mute);font-size:14px">'+esc((tx(o.s)||"").slice(0,110))+'…</div></div><button class="btn" id="snow" style="display:block;text-align:center;margin-top:12px">'+t("shNow")+'</button><div class="sg"><button data-s="link"><b>🔗</b>'+t("cpL")+'</button><button data-s="text"><b>📋</b>'+t("cpT")+'</button><a id="shw" target="_blank" rel="noopener"><b>💬</b>WhatsApp</a><a id="shf" target="_blank" rel="noopener"><b>📘</b>Facebook</a><a id="sht" target="_blank" rel="noopener"><b>✈️</b>Telegram</a><a id="shx" target="_blank" rel="noopener"><b>✖️</b>X</a><a id="she" target="_blank" rel="noopener"><b>✉️</b>Email</a><button data-s="more"><b>⋯</b>'+t("more2")+'</button></div></div>';
  $("sheet").classList.add("show");updLinks();$("scap").focus()}
$("sheet").oninput=function(e){if(e.target.id=="scap")updLinks()};
$("sheet").onclick=function(e){
  if(e.target.id=="sheet"||e.target.closest("[data-x]")){closeSh();return}
  if(e.target.closest("#dyes")){var dp=delP;closeSh();if(dp){doDel(dp);toast(t("dOk"))}return}
  if(e.target.closest("#snow")){var o=shO(),c=$("scap").value.trim();
    posts.unshift({id:"u"+Date.now(),sh:o.id,cap:c,c:o.c,own:1,uid:cur.id,an:cur.name,ts:Date.now(),v:0,cm:[]});persist();closeSh();toast(t("shd"));if(view=="home")list();else if(view=="profile")render();return}
  var b=e.target.closest("[data-s]");if(!b)return;
  if(b.dataset.s=="link")cp(shUrl());
  else if(b.dataset.s=="text")cp(shMsg()+"\n"+shUrl());

function authHtml(){var su=authMode=="signup";return'<div class="card auth"><h2 style="margin:0 0 4px">'+t(su?"suT":"liT")+'</h2><p style="margin:0 0 12px;color:var(--mute)">'+t("auSub")+'</p>'+(su?'<label class="lbl" for="an1">'+t("nl")+'</label><input id="an1" maxlength="30" autocomplete="name"><div style="height:10px"></div>':'')+'<label class="lbl" for="ae">'+t("em")+'</label><input id="ae" type="email" autocomplete="email"><div style="height:10px"></div><label class="lbl" for="ap">'+t("pw")+'</label><input id="ap" type="password" autocomplete="'+(su?"new-password":"current-password")+'"><label class="chk" style="margin-top:8px"><input type="checkbox" id="asp"> '+t("showPw")+'</label><div id="aer" class="aer" role="alert"></div><button class="btn" id="asub" style="display:block;text-align:center;margin-top:8px">'+t(su?"suB":"liB")+'</button><p style="text-align:center;margin:14px 0 0">'+t(su?"haveAcc":"noAcc")+' <button class="more" id="asw">'+t(su?"liB":"suB")+'</button></p><p style="text-align:center;margin:6px 0 0"><button class="more" id="agu">'+t("guest")+'</button></p><p class="cnt" style="text-align:center">'+t("demoNote")+'</p></div>'}
function setOwn(){posts.forEach(function(p){p.own=cur&&p.uid==cur.id?1:0;(p.cm||[]).forEach(function(c){c.own=cur&&c.uid==cur.id?1:0})})}
function setUser(a){cur=a;prof=a||{name:"",bio:""};
  if(a){voted=ld("ml2-voted-"+a.id,{});saved=ld("ml2-saved-"+a.id,{});notifs=ld("ml2-notifs-"+a.id,null)||[{id:"n1",k:"nwel",ts:Date.now()-60000,r:0},{id:"n2",k:"ntip",ts:Date.now()-120000,r:0}];sv("ml2-sess",a.id)}
  else{voted={};saved={};notifs=[];try{localStorage.removeItem("ml2-sess")}catch(e){}}
  setOwn()}
async function hsh(pw,salt){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){return salt+":"+btoa(unescape(encodeURIComponent(pw)))}}
async function doAuth(){var em=$("ae").value.trim().toLowerCase(),pw=$("ap").value,er=$("aer"),su=authMode=="signup";
  if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent=t("eEm");return}
  if(pw.length<6){er.textContent=t("ePw");return}
  if(su){var nm=$("an1").value.trim();if(!nm){er.textContent=t("eNm");return}
    if(accts.some(function(x){return x.email==em})){er.textContent=t("eDup");return}
    var salt=Math.random().toString(36).slice(2),a={id:"a"+Date.now(),email:em,name:nm,bio:"",salt:salt,h:await hsh(pw,salt)};
    if(!accts.length)posts.forEach(function(p){if(p.own&&!p.uid){p.uid=a.id;p.an=nm}(p.cm||[]).forEach(function(c){if(c.own&&!c.uid){c.uid=a.id;c.an=nm}})});
    accts.push(a);sv("ml2-accts",accts);setUser(a);persist()}
  else{var b=accts.filter(function(x){return x.email==em})[0];if(!b||await hsh(pw,b.salt)!=b.h){er.textContent=t("eBad");return}setUser(b)}
  toast(t(su?"wSu":"wLi"));go("home")}
$("au").onclick=function(){if(cur){setUser(null);toast(t("out"));go("home")}else{authMode="login";go("auth")}};
function openDel(p){delP=p;$("sheet").innerHTML='<div class="sh" role="alertdialog" aria-modal="true" style="max-width:380px"><h4 style="margin:0 0 6px;font-size:19px">'+t("dT")+'</h4><p style="margin:0 0 14px;color:var(--mute)">'+t("dP")+'</p><div class="row" style="justify-content:flex-end"><button class="btn g" data-x="1">'+t("cancel")+'</button><button class="btn" id="dyes" style="background:#d33">'+t("dY")+'</button></div></div>';$("sheet").classList.add("show")}
function doDel(p){posts=posts.filter(function(x){return x.id!=p.id});delete saved[p.id];persist();list()}
document.addEventListener("click",function(e){if(menuId&&!e.target.closest(".mw")){menuId=null;document.querySelectorAll(".menu").forEach(function(m){m.remove()})}},true);
var h0=location.hash.slice(1);if(["notifications","profile"].indexOf(h0)>-1)view=h0;
var sid=ld("ml2-sess",null),sa=accts.filter(function(x){return x.id==sid})[0];setUser(sa||null);if(!cur&&view!="home")view="auth";
document.documentElement.lang=lang;render();
